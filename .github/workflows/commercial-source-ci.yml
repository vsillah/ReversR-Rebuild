name: ReversR Commercial Source CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  commercial-source-ci:
    name: Commercial isolation and CAD upload denial
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify commercial isolation and CAD upload denial
        run: |
          env -i PATH="$PATH" node scripts/commercial-credit-gate-smoke.js
          env -i PATH="$PATH" node --test scripts/cad-user-upload-route.test.js
